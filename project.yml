name: OmoUsage

options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  OmoUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/OmoUsage
        excludes:
          - Mobile
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/OmoUsage.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.omo.usage"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omo.usage
        PRODUCT_NAME: OmoUsage
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: libsqlite3.tbd

  OmoUsageMobile:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Sources/OmoUsage/Models/ProviderID.swift
      - path: Sources/OmoUsage/Models/ProviderVisualStyle.swift
      - path: Sources/OmoUsage/Models/UsageModels.swift
      - path: Sources/OmoUsage/Models/DashboardSnapshot.swift
      - path: Sources/OmoUsage/Settings/ProviderDisplayOrderStore.swift
      - path: Sources/OmoUsage/Localization
      - path: Sources/OmoUsage/Sync
      - path: Sources/OmoUsage/Mobile
    info:
      path: Config/MobileInfo.plist
    entitlements:
      path: Config/OmoUsageMobile.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.omo.usage"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omo.usage.mobile
        PRODUCT_NAME: OmoUsage
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  OmoUsage:
    build:
      targets:
        OmoUsage: all
  OmoUsageMobile:
    build:
      targets:
        OmoUsageMobile: all
    run:
      config: Debug
