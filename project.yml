name: OmoUsage

options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  OmoUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/OmoUsage
        excludes:
          - Mobile
          - AGENTS.md
          - Credentials/AGENTS.md
          - Providers/AGENTS.md
          - Settings/AGENTS.md
          - WebDashboard/AGENTS.md
    entitlements:
      path: Config/OmoUsage.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.omo.usage"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omo.usage
        PRODUCT_NAME: OmoUsage
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/Info.plist
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OMO_USAGE_FIXTURES"
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    dependencies:
      - target: OmoUsageCore
      - sdk: libsqlite3.tbd
      - package: Sparkle

  OmoUsageCore:
    type: framework
    platform: iOS
    supportedDestinations:
      - macOS
      - iOS
    sources:
      - path: Sources/OmoUsageCore
        excludes:
          - AGENTS.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omo.usage.core
        PRODUCT_NAME: OmoUsageCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: YES

  OmoUsageMobile:
    type: application
    platform: iOS
    productName: OmoUsage
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Sources/OmoUsage/Mobile
      - path: Sources/OmoUsage/Resources/ProviderIcons
        type: folder
        buildPhase: resources
    entitlements:
      path: Config/OmoUsageMobile.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.omo.usage"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omo.usage.mobile
        PRODUCT_NAME: OmoUsage
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Config/MobileInfo.plist
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    dependencies:
      - target: OmoUsageCore

schemes:
  OmoUsage:
    build:
      targets:
        OmoUsage: all
  OmoUsageMobile:
    build:
      targets:
        OmoUsageMobile: all
    run:
      config: Debug
